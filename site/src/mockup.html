<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;src:url(../../assets/fonts/static/Fredoka-600.ttf);font-weight:600}
@font-face{font-family:Nunito;src:url(../../assets/fonts/static/Nunito-700.ttf);font-weight:700}
html,body{margin:0}
#s{width:1200px;height:1000px;position:relative;overflow:hidden;border-radius:36px;
 background:radial-gradient(circle at 50% 45%,#FBF7F1 0,#F3E9DC 55%,#E6D5BE 100%)}
.blob{position:absolute;border-radius:50%;opacity:.55}
.card{position:absolute;width:250px;background:#fff;border-radius:14px;padding:8px;
 box-shadow:0 14px 30px rgba(74,58,46,.22)}
.card img{width:100%;display:block;border-radius:8px}
.tab{position:absolute;left:300px;top:110px;width:500px;height:660px;background:#3b2f26;border-radius:42px;padding:22px;
 box-shadow:0 30px 60px rgba(74,58,46,.40);transform:rotate(-3deg)}
.tab img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}
.ph{position:absolute;left:845px;top:505px;width:230px;height:470px;background:#2e251e;border-radius:38px;padding:11px;
 box-shadow:0 26px 50px rgba(74,58,46,.45);transform:rotate(4deg)}
.ph .scr{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#FBF7F1;position:relative}
.ph .scr img{width:100%;display:block;margin-top:0}
.ph .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:#2e251e;border-radius:10px;z-index:2}
.seal{position:absolute;left:770px;top:70px;width:150px;height:150px;border-radius:50%;background:#C9704F;color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Fredoka;
 box-shadow:0 0 0 7px #FBF7F1,0 0 0 10px #C9704F,0 14px 30px rgba(74,58,46,.3);transform:rotate(10deg)}
.seal b{font-size:40px;line-height:1}.seal span{font-size:17px;line-height:1.1;margin-top:4px;font-family:Nunito}
.dove{position:absolute;width:120px;opacity:.9}
</style></head><body><div id="s">
<div class="blob" style="width:420px;height:420px;background:#8FAE8B;left:-120px;top:-110px;opacity:.25"></div>
<div class="blob" style="width:380px;height:380px;background:#D9896C;right:-110px;bottom:-130px;opacity:.22"></div>
<div class="blob" style="width:240px;height:240px;background:#8DB8D6;right:-60px;top:260px;opacity:.22"></div>
<div class="card" style="left:40px;top:60px;transform:rotate(-8deg)"><img src="../img/ficha_01-002.jpg"></div>
<div class="card" style="left:70px;top:520px;transform:rotate(6deg)"><img src="../img/ficha_07-035.jpg"></div>
<div class="card" style="left:930px;top:40px;transform:rotate(7deg)"><img src="../img/ficha_07-015.jpg"></div>
<div class="card" style="left:1000px;top:330px;transform:rotate(-6deg);width:200px"><img src="../img/ficha_08-002.jpg"></div>
<div class="card" style="left:470px;top:760px;transform:rotate(-2deg);width:230px"><img src="../img/ficha_06-003.jpg"></div>
<div class="tab"><img src="../img/capa.jpg"></div>
<div class="ph"><div class="notch"></div><div class="scr"><img src="../img/ficha_07-056.jpg"></div></div>
<div class="seal"><b>PDF</b><span>listo para<br>imprimir</span></div>
</div></body></html>
